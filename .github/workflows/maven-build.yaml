name: Build CI
permissions:
  id-token: write
  contents: read
  packages: write
on:
  workflow_dispatch:
env:
  JAVA_VER: 17
  ACR_NAME: placeholder
  ACR_URL: placehoder
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: targetJar
          path: target/*.jar
  dockerBuild:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: targetJar
          path: target
      - name: build tag generation
        id: version
        run: |
           TAG=1.0.${GITHUB_RUN_NUMBER}
           echo "image_tag=$TAG" >> $GITHUB_OUTPUT
      - name: azure oidc federated login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: docker login
        run: |
            az acr login --name mylabkrnetwork
      - uses: docker/build-push-action@v7
        name: docker build and push
        with:
          context: .
          push: true
          tags: mylabkrnetwork.azurecr.io/addressbook:${{ steps.version.outputs.image_tag }}
      - name: install helm
        uses: azure/setup-helm@v4
      - name: helm package push
        run: |
          TOKEN=$( az acr login --name mylabkrnetwork --expose-token --output tsv --query accessToken )
          helm registry login mylabkrnetwork.azurecr.io --username "00000000-0000-0000-0000-000000000000" --password $TOKEN
          helm package helm/addressbook --version ${{ steps.version.outputs.image_tag }} --app-version ${{ steps.version.outputs.image_tag }} 
          helm push *.tgz oci://mylabkrnetwork.azurecr.io/helm
  deploy:
    needs: dockerBuild
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: azure oidc federated login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: ACR login
        run: |
          az acr login --name mylabkrnetwork

      - name: get AKS credentials
        run: |
          az aks get-credentials --resource-group rg-demo --name myaks --overwrite-existing

      - name: deploy helm chart
        run: |
          TOKEN=$(az acr login --name mylabkrnetwork --expose-token --output tsv --query accessToken)
          helm registry login mylabkrnetwork.azurecr.io --username "00000000-0000-0000-0000-000000000000" --password $TOKEN
          
          helm upgrade --install addressbook \
            oci://mylabkrnetwork.azurecr.io/helm/addressbook \
            --version ${{ needs.dockerBuild.outputs.image_tag }} \
            --namespace default \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: verify deployment
        run: |
          kubectl rollout status deployment/addressbook -n default --timeout=5m
          kubectl get pods -n default -l app=addressbook

