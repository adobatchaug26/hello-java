name: Build CI
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  JAVA_VER: 17
  AZ_CLIENT_ID: 18ba0f09-7cb3-4378-a5bf-27493c43e4b5
  AZ_TENENT_ID: 86e95ea4-8f08-4f88-92bd-5878a530732e
  AZ_SUB_ID: 1f41fc1d-b59a-4538-bdb7-b94d0fed85e3
  ACR_NAME: placeholder
  ACR_URL: placehoder
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: targetJar
          path: target/*.jar
  dockerBuild:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: targetJar
      - name: build tag generation
        id: version
        run: |
           TAG=1.0.${GITHUB_RUN_NUMBER}
      - name: azure oidc federated login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenent-id: ${{ env.AZ_TENENT_ID }}
          subscription-id: ${{ env.AZ_SUB_ID }}
      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show
  helmpackage:
    needs: dockerBuild
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: helm install
        uses: Azure/setup-helm@v3
      - name: helm package
        run: |
          helm package helm/addressbook

