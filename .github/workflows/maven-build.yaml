name: Build CI
permissions:
  id-token: write
  contents: read
  packages: write
on:
  workflow_dispatch:
env:
  JAVA_VER: 17
  ACR_NAME: placeholder
  ACR_URL: placehoder
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: targetJar
          path: target/*.jar
  dockerBuild:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: targetJar
      - name: build tag generation
        id: version
        run: |
           TAG=1.0.${GITHUB_RUN_NUMBER}
           echo "image_tag=$TAG" >> $GITHUB_OUTPUT
      - name: azure oidc federated login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: docker step with ACR
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az acr login --name mylabkrnetwork
            docker build -t mylabkrnetwork.azurecr.io/addressbook:${{ steps.version.outputs.image_tag }} . -f Dockerfile
            docker push mylabkrnetwork.azurecr.io/addressbook:${{ steps.version.outputs.image_tag }}
      - name: install helm
        uses: azure/setup-helm@v4
      - name: helm package push
        run: |
          TOKEN=$( az acr login --name mylabkrnetwork --expose-token --output tsv --query accessToken )
          helm registry login mylabkrnetwork.azurecr.io --username "00000000-0000-0000-0000-000000000000" --password $TOKEN
          helm package helm/addressbook --version ${{ steps.version.outputs.image_tag }} --app-version ${{ steps.version.outputs.image_tag }} 
          helm push *.tgz oci://mylabkrnetwork.azurecr.io/helm


